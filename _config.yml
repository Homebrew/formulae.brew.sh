title: Homebrew Formulae
description: Homebrew's package index
url: https://formulae.brew.sh

exclude:
  - bin
  - script
  - CNAME
  - LICENSE.txt
  - README.md
  - Gemfile*
  - vendor
  - docs/.ruby-version
  - docs/Gemfile*

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: :title

defaults:
  - scope:
      path: ""
    values:
      image: https://brew.sh/assets/img/homebrew-256x256.png
      search_name: Homebrew Formulae
      search_site: formulae

taps:
  core:
    repository: core
    name: Homebrew/core
    fullname: Homebrew/homebrew-core
    remote: https://github.com/Homebrew/homebrew-core
  cask:
    repository: cask
    name: Homebrew/cask
    fullname: Homebrew/homebrew-cask
    remote: https://github.com/Homebrew/homebrew-cask

# macOS versions that run on Intel hardware. Unprefixed cask platform tags
# outside this list are Rosetta-only and should not be advertised.
intel_macos_platforms:
  - tahoe
  - sequoia
  - sonoma
  - ventura
  - monterey
  - big_sur
  - catalina

cask_artifact_names:
  app: App
  app_image: App Image
  artifact: Artifact
  audio_unit_plugin: Audio Unit Plugin
  bash_completion: Bash Completion
  binary: Binary
  colorpicker: Colorpicker
  command_wrapper: Command Wrapper
  dictionary: Dictionary
  fish_completion: Fish Completion
  font: Font
  generate_completions_from_executable: Generated Completion
  generated_script: Generated Script
  input_method: Input Method
  installer: Installer
  internet_plugin: Internet Plugin
  keyboard_layout: Keyboard Layout
  manpage: Manpage
  mdimporter: Metadata Importer
  pkg: Package Installer
  prefpane: Preference Pane
  qlplugin: Quick Look Plugin
  screen_saver: Screen Saver
  service: Service
  stage_only: Stage Only
  suite: Suite
  vst3_plugin: VST3 Plugin
  vst_plugin: VST Plugin
  zsh_completion: Zsh Completion

analytics:
  intervals:
    - name: 30 days
      path: 30d
    - name: 90 days
      path: 90d
    - name: 365 days
      path: 365d
  categories:
    formulae:
      - name: Installs
        path: install
      - name: Installs on Request
        path: install-on-request
      - name: Build Errors
        path: build-error

# sync with Library/Homebrew/deprecate_disable.rb
reasons:
  formula:
    does_not_build: "does not build"
    no_license: "has no license"
    repo_archived: "has an archived upstream repository"
    repo_removed: "has a removed upstream repository"
    unmaintained: "is not maintained upstream"
    unsupported: "is not supported upstream"
    deprecated_upstream: "is deprecated upstream"
    versioned_formula: "is a versioned formula"
    checksum_mismatch: "was built with an initially released source file that had a different checksum than the current one"
  cask:
    discontinued: "is discontinued upstream"
    moved_to_mas: "is now exclusively distributed on the Mac App Store"
    no_longer_available: "is no longer available upstream"
    no_longer_meets_criteria: "no longer meets the criteria for acceptable casks"
    unmaintained: "is not maintained upstream"
    fails_gatekeeper_check: "does not pass the macOS Gatekeeper check"
    unreachable: "is no longer reliably reachable upstream"

logo: https://brew.sh/assets/img/homebrew.svg

forkme_nwo: Homebrew/formulae.brew.sh

twitter:
  username: MacHomebrew

facebook:
  publisher: https://www.facebook.com/machomebrew/
