name: CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-cask:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate homebrew/cask data, pages and API
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: false
          cask: shallow
          stable: false

      - run: brew generate-cask-api

      - name: Archive data
        run: tar czf data-cask.tar.gz _data/cask/ _data/cask_canonical.json api/cask/ api/cask_tap_migrations.json api/internal/cask.* cask/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-cask
          path: data-cask.tar.gz
          compression-level: 0
          retention-days: 1

  generate-core:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate homebrew/core data, pages and API
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: shallow
          cask: false
          stable: false

      - run: brew test-bot --only-cleanup-before

      - run: brew generate-formula-api

      - name: Archive data
        run: tar czf data-core.tar.gz _data/formula/ _data/formula_canonical.json api/formula/ api/formula_tap_migrations.json api/internal/formula.* api/internal/executables.txt formula/ _data/analytics/security/current.json api/analytics/security/current.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-core
          path: data-core.tar.gz
          compression-level: 0
          retention-days: 1

  generate-feeds:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate ${{ matrix.package }} feeds
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: formula
            tap: core
          - package: cask
            tap: cask
    env:
      HOMEBREW_DEVELOPER: 1
      PACKAGE: ${{ matrix.package }}
      TAP: ${{ matrix.tap }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: ${{ matrix.tap == 'core' && 'shallow' || false }}
          cask: ${{ matrix.tap == 'cask' && 'shallow' || false }}
          stable: false

      - run: brew test-bot --only-cleanup-before

      # Cleanup removes zstd; retain compatibility with existing gzip caches.
      - name: Restore feeds
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/${{ matrix.package }}_feeds.json
          key: ${{ matrix.package }}-feeds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ matrix.package }}-feeds-

      - name: Generate feeds
        id: feeds
        timeout-minutes: 5
        continue-on-error: true
        run: |
          repository="$(brew --repo "homebrew/${TAP}")"
          if [[ "$(git -C "$repository" rev-parse --is-shallow-repository)" == true ]]; then
            # Shallow setup disables transports; opt in for this history fetch.
            git -C "$repository" -c protocol.https.allow=always fetch --unshallow origin
          fi
          brew "generate-${PACKAGE}-feeds" --output="$RUNNER_TEMP/${PACKAGE}_feeds.json"
          ruby script/validate-feeds.rb "$RUNNER_TEMP/${PACKAGE}_feeds.json"
          mkdir -p _data
          mv "$RUNNER_TEMP/${PACKAGE}_feeds.json" "_data/${PACKAGE}_feeds.json"

      - name: Validate feeds
        run: ruby script/validate-feeds.rb "_data/${PACKAGE}_feeds.json"

      - name: Report cached fallback
        if: steps.feeds.outcome != 'success'
        run: echo "::warning title=Feed fallback::Refresh failed; publishing the last validated ${PACKAGE} feeds."

      - name: Save feeds
        if: github.ref == 'refs/heads/main' && steps.feeds.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/${{ matrix.package }}_feeds.json
          key: ${{ matrix.package }}-feeds-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive data
        run: tar czf "data-feeds-${PACKAGE}.tar.gz" "_data/${PACKAGE}_feeds.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-feeds-${{ matrix.package }}
          path: data-feeds-${{ matrix.package }}.tar.gz
          compression-level: 0
          retention-days: 1

  generate-internal:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate internal API data
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: shallow
          cask: shallow
          stable: false

      - run: brew test-bot --only-cleanup-before

      # A bottle index pinned by `manifest_sha256` never changes, so keep the ones already
      # fetched and download only new ones. A new month starts afresh to drop superseded ones.
      - name: Locate bottle manifests
        id: bottle-manifests
        run: |
          echo "path=$(brew --cache)/downloads/*.bottle_manifest.json" >>"$GITHUB_OUTPUT"
          echo "key=bottle-manifests-$(date -u +%Y-%m)-" >>"$GITHUB_OUTPUT"

      - name: Restore bottle manifests
        id: restore-bottle-manifests
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bottle-manifests.outputs.path }}
          key: ${{ steps.bottle-manifests.outputs.key }}
          restore-keys: ${{ steps.bottle-manifests.outputs.key }}

      - run: brew generate-internal-api

      # Runs after a failure too, so the next run does not fetch the same manifests again.
      - name: Hash bottle manifest names
        id: hash-bottle-manifests
        if: always() && steps.bottle-manifests.outcome == 'success'
        env:
          KEY: ${{ steps.bottle-manifests.outputs.key }}
        run: |
          shopt -s nullglob
          manifests=("$(brew --cache)"/downloads/*.bottle_manifest.json)
          if [[ "${#manifests[@]}" -gt 0 ]]; then
            echo "key=${KEY}$(printf '%s\n' "${manifests[@]##*/}" | shasum -a 256 | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          fi

      - name: Save bottle manifests
        if: >-
          always() && github.ref == 'refs/heads/main' && steps.hash-bottle-manifests.outputs.key &&
          steps.hash-bottle-manifests.outputs.key != steps.restore-bottle-manifests.outputs.cache-matched-key
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bottle-manifests.outputs.path }}
          key: ${{ steps.hash-bottle-manifests.outputs.key }}

      - name: Archive data
        run: tar czf data-internal.tar.gz api/internal/packages.*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-internal
          path: data-internal.tar.gz
          compression-level: 0
          retention-days: 1

  generate-advisories:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate advisory API data
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out advisory database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/advisory-database
          path: advisory-database
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: false
          cask: false
          stable: false

      - name: Resolve advisory cache key
        id: advisory-database
        # advisories/ tree plus generator source, so unrelated commits keep the hit.
        run: |
          set -euo pipefail
          tree="$(git -C advisory-database rev-parse HEAD:advisories)"
          generator="$(cat "$(brew --repo)/Library/Homebrew/dev-cmd/generate-advisories-api.rb" "$(brew --repo)/Library/Homebrew/utils/analytics/vulnerabilities.rb" | shasum -a 256 | cut -c1-12)"
          echo "key=advisories-data-v2-${generator}-${tree}" >> "$GITHUB_OUTPUT"

      - name: Restore advisory data cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            api/advisories.json
            _data/analytics/security/corpus.json
            api/analytics/security/corpus.json
          key: ${{ steps.advisory-database.outputs.key }}

      - name: Generate advisory API data
        if: steps.cache.outputs.cache-hit != 'true'
        # Fail closed: never republish stale advisory data.
        run: brew generate-advisories-api advisory-database

      - name: Validate advisory data
        run: |
          test -s api/advisories.json
          test -s _data/analytics/security/corpus.json
          test -s api/analytics/security/corpus.json

      - name: Save advisory data cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            api/advisories.json
            _data/analytics/security/corpus.json
            api/analytics/security/corpus.json
          key: ${{ steps.advisory-database.outputs.key }}

      - name: Archive data
        run: tar czf data-advisories.tar.gz api/advisories.json _data/analytics/security/corpus.json api/analytics/security/corpus.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-advisories
          path: data-advisories.tar.gz
          compression-level: 0
          retention-days: 1

  generate-analytics:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Restore analytics data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine analytics cache date
        id: analytics-cache-date
        run: date -u +"date=%Y-%m-%d" >> "$GITHUB_OUTPUT"

      - name: Restore analytics data cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics
            api/analytics
          key: analytics-data-v9-${{ hashFiles('analytics/history.json') }}-${{ steps.analytics-cache-date.outputs.date }}
          # Keep publishing while the daily workflow refreshes analytics.
          restore-keys: |
            analytics-data-v9-${{ hashFiles('analytics/history.json') }}-
            analytics-data-v9-

      - name: Validate analytics data
        run: ruby script/validate-analytics.rb

      - name: Archive data
        run: tar czf data-analytics.tar.gz _data/analytics api/analytics

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-analytics
          path: data-analytics.tar.gz
          compression-level: 0
          retention-days: 1

  build:
    needs: [generate-cask, generate-core, generate-feeds, generate-internal, generate-advisories, generate-analytics]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: false
          cask: false
          stable: false

      - name: Set up Ruby
        uses: Homebrew/actions/setup-ruby@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          bundler-cache: true
          portable-ruby: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Move artifacts into place
        run: |
          tar xf data-advisories/data-advisories.tar.gz
          tar xf data-analytics/data-analytics.tar.gz
          tar xf data-cask/data-cask.tar.gz
          tar xf data-core/data-core.tar.gz
          tar xf data-feeds-cask/data-feeds-cask.tar.gz
          tar xf data-feeds-formula/data-feeds-formula.tar.gz
          tar xf data-internal/data-internal.tar.gz

      - name: Generate API samples
        run: |
          GENERATE_SAMPLES="${{ github.ref_name == 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]') }}"
          if [ "$GENERATE_SAMPLES" = "true" ]; then
            ruby script/generate-api-samples.rb
          else
            ruby script/generate-api-samples.rb --template
          fi

      - name: Build site
        run: bundle exec jekyll build --profile

      - name: Validate build
        run: ./script/validate-build.rb

      - name: Test generated site
        env:
          API_SIGNING_TEST_SITE: _site
          FORMULA_FEEDS_TEST_SITE: _site
        run: bundle exec rspec

      - name: Upload unsigned site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: unsigned-site

  deploy:
    needs: build
    if: >-
      github.repository == 'Homebrew/formulae.brew.sh' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
      pages: write
      id-token: write
    # JWS_HOMEBREW_1 must exist only in this environment, restricted to branch main.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    outputs:
      deploy_url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out signing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: false
          cask: false
          stable: false
          # Don't export a GitHub token into the job that holds the signing key.
          brew-gh-api-token: ""

      - name: Set up Ruby
        uses: Homebrew/actions/setup-ruby@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          bundler-cache: true
          portable-ruby: true

      - name: Download unsigned site from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-site
          path: unsigned-site

      - name: Restore unsigned site
        run: |
          mkdir _site
          tar --extract --file unsigned-site/artifact.tar --directory _site

      - name: Sign and verify API
        env:
          JWS_SIGNING_KEY_ID: homebrew-1
          JWS_SIGNING_KEY: ${{ secrets.JWS_HOMEBREW_1 }}
        run: bundle exec script/sign-json.rb

      - name: Upload signed site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        # `deploy-pages` can fail to find an artifact that was only just uploaded.
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # `page_url` is only set once a Pages deployment exists, so don't retry after that.
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [[ -n "${PAGE_URL}" ]]
          then
            echo "::error::The GitHub Pages deployment was created but failed, so it won't be retried."
            exit 1
          fi
          sleep 10

      - name: Retry deploying to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  deploy-issue:
    name: Open/close deploy issues
    needs: [generate-cask, generate-core, generate-feeds, generate-analytics, generate-internal, generate-advisories, build, deploy]
    if: ${{ always() && github.ref_name == 'main' }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # for Homebrew/actions/create-or-update-issue
    steps:
      - name: Open, update, or close deploy issue
        uses: Homebrew/actions/create-or-update-issue@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          title: formulae.brew.sh deployment failed!
          body: The most recent [formulae.brew.sh deployment failed](${{ env.RUN_URL }}).
          labels: deploy failure
          update-existing: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
          close-existing: ${{ needs.deploy.result == 'success' }}
          close-from-author: github-actions[bot]
          close-comment: The most recent [formulae.brew.sh deployment succeeded](${{ env.RUN_URL }}). Closing issue.
