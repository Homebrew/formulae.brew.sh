name: CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-cask:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate homebrew/cask data, pages and API
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
          stable: false

      - run: brew generate-cask-api

      - name: Archive data
        run: tar czvf data-cask.tar.gz _data/cask/ api/cask/ api/cask_tap_migrations.json api/internal/cask.* cask/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-cask
          path: data-cask.tar.gz
          retention-days: 1

  generate-core:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate homebrew/core data, pages and API
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    outputs:
      formula-feeds-available: ${{ steps.formula-feeds-fallback.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: false
          stable: false

      - run: brew test-bot --only-cleanup-before

      - run: brew generate-formula-api

      - name: Restore formula feeds
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/formula_feeds.json
          key: formula-feeds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: formula-feeds-

      - name: Generate formula feeds
        id: formula-feeds
        continue-on-error: true
        timeout-minutes: 3
        run: |
          core="$(brew --repo homebrew/core)"
          if [[ "$(git -C "$core" rev-parse --is-shallow-repository)" == true ]]; then
            git -C "$core" fetch --unshallow origin
          fi
          brew generate-formula-feeds --output="$RUNNER_TEMP/formula_feeds.json"
          jq -e '(.new | length) == 50 and (.updated | length) == 500' "$RUNNER_TEMP/formula_feeds.json" >/dev/null
          mv "$RUNNER_TEMP/formula_feeds.json" _data/formula_feeds.json

      - name: Keep formula feeds available
        id: formula-feeds-fallback
        env:
          FEED_GENERATION_OUTCOME: ${{ steps.formula-feeds.outcome }}
        run: |
          if jq -e '(.new | length) == 50 and (.updated | length) == 500' _data/formula_feeds.json >/dev/null 2>&1; then
            if [[ "$FEED_GENERATION_OUTCOME" != success ]]; then
              echo "::warning::Formula feed generation failed; retaining the last successful feeds."
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Formula feeds are unavailable; publishing empty feeds until generation succeeds."
            mkdir -p _data
            printf '%s\n' '{"new":[],"updated":[]}' > _data/formula_feeds.json
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save formula feeds
        if: steps.formula-feeds.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/formula_feeds.json
          key: formula-feeds-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive data
        run: tar czvf data-core.tar.gz _data/formula/ _data/formula_canonical.json _data/formula_feeds.json api/formula/ api/formula_tap_migrations.json api/internal/formula.* formula/ _data/analytics/security/current.json api/analytics/security/current.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-core
          path: data-core.tar.gz
          retention-days: 1

  generate-internal:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate internal API data
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: true
          stable: false

      - run: brew test-bot --only-cleanup-before

      - run: brew generate-internal-api

      - name: Archive data
        run: tar czvf data-internal.tar.gz api/internal/packages.*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-internal
          path: data-internal.tar.gz
          retention-days: 1

  generate-advisories:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate advisory API data
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out advisory database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/advisory-database
          path: advisory-database
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: true
          stable: false

      - name: Resolve advisory cache key
        id: advisory-database
        # advisories/ tree plus generator source, so unrelated commits keep the hit.
        run: |
          set -euo pipefail
          tree="$(git -C advisory-database rev-parse HEAD:advisories)"
          generator="$(cat "$(brew --repo)/Library/Homebrew/dev-cmd/generate-advisories-api.rb" "$(brew --repo)/Library/Homebrew/utils/analytics/vulnerabilities.rb" | shasum -a 256 | cut -c1-12)"
          echo "key=advisories-data-v2-${generator}-${tree}" >> "$GITHUB_OUTPUT"

      - name: Restore advisory data cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            api/advisories.json
            _data/analytics/security/corpus.json
            api/analytics/security/corpus.json
          key: ${{ steps.advisory-database.outputs.key }}

      - name: Generate advisory API data
        if: steps.cache.outputs.cache-hit != 'true'
        # Fail closed: never republish stale advisory data.
        run: brew generate-advisories-api advisory-database

      - name: Validate advisory data
        run: |
          test -s api/advisories.json
          test -s _data/analytics/security/corpus.json
          test -s api/analytics/security/corpus.json

      - name: Save advisory data cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            api/advisories.json
            _data/analytics/security/corpus.json
            api/analytics/security/corpus.json
          key: ${{ steps.advisory-database.outputs.key }}

      - name: Archive data
        run: tar czvf data-advisories.tar.gz api/advisories.json _data/analytics/security/corpus.json api/analytics/security/corpus.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-advisories
          path: data-advisories.tar.gz
          retention-days: 1

  generate-analytics:
    if: startsWith( github.repository, 'Homebrew/' )
    name: Generate analytics data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false
          stable: false

      - name: Set up Ruby
        uses: Homebrew/actions/setup-ruby@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          bundler-cache: true
          portable-ruby: true

      - name: Get formula analytics paths
        id: formula-analytics
        run: |
          {
            echo "directory=$(brew --repo)/Library/Homebrew/formula-analytics"
            echo "uv-cache-directory=${HOME}/.cache/uv"
            echo "downloads-cache-directory=$(brew --cache)/github-packages-downloads"
            echo "analytics-cache-directory=$(brew --cache)/analytics"
          } >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: ${{ steps.formula-analytics.outputs.directory }}
          cache-local-path: ${{ steps.formula-analytics.outputs.uv-cache-directory }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Create directories
        run: mkdir -p _data/analytics api/analytics

      - name: Determine analytics cache date
        id: analytics-cache-date
        run: date -u +"date=%Y-%m-%d" >> "$GITHUB_OUTPUT"

      - name: Restore analytics data cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics
            api/analytics
          key: analytics-data-v9-${{ hashFiles('analytics/history.json') }}-${{ steps.analytics-cache-date.outputs.date }}
          # Restricted PRs may reuse a different history snapshot.
          restore-keys: |
            analytics-data-v9-${{ hashFiles('analytics/history.json') }}-
            ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') && 'analytics-data-v9-' || '' }}

      - name: Restore analytics working cache
        id: working-cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.formula-analytics.outputs.downloads-cache-directory }}
            ${{ steps.formula-analytics.outputs.analytics-cache-directory }}
          key: analytics-working-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: analytics-working-v1-

      - name: Bootstrap formula history checkpoint
        id: bootstrap
        continue-on-error: ${{ steps.cache.outputs.cache-matched-key != '' }}
        if: steps.cache.outputs.cache-hit != 'true' && (github.ref_name == 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'))
        run: ruby script/bootstrap-formula-history.rb "${ANALYTICS_CACHE_DIRECTORY}/git/formula-history.json"
        env:
          ANALYTICS_CACHE_DIRECTORY: ${{ steps.formula-analytics.outputs.analytics-cache-directory }}

      - name: Prepare complete repository histories
        id: histories
        continue-on-error: ${{ steps.cache.outputs.cache-matched-key != '' }}
        if: steps.cache.outputs.cache-hit != 'true' && (github.ref_name == 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'))
        run: |
          set -euo pipefail
          brew tap --force homebrew/core
          brew tap --force homebrew/cask
          for repository in "$(brew --repo)" "$(brew --repo homebrew/core)" "$(brew --repo homebrew/cask)"; do
            if [[ "$(git -C "$repository" rev-parse --is-shallow-repository)" == true ]]; then
              git -C "$repository" fetch --unshallow origin
            fi
          done
          git -C "$(brew --repo)" fetch --tags origin
          legacy_repository="$(brew --cache)/analytics/legacy-homebrew"
          if [[ ! -d "$legacy_repository" ]]; then
            git clone --bare --filter=blob:none https://github.com/Homebrew/legacy-homebrew "$legacy_repository"
          fi

      - name: Prepare brew.sh posts
        id: posts
        continue-on-error: ${{ steps.cache.outputs.cache-matched-key != '' }}
        if: steps.cache.outputs.cache-hit != 'true' && (github.ref_name == 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'))
        run: |
          posts="$(brew --cache)/analytics/brew.sh"
          if [[ -d "$posts" ]]; then
            git -C "$posts" fetch --depth=1 origin HEAD
            git -C "$posts" update-ref HEAD FETCH_HEAD
          else
            git clone --bare --filter=blob:none --depth=1 https://github.com/Homebrew/brew.sh "$posts"
          fi

      - name: Update analytics data
        id: update
        run: |
          set -euo pipefail

          if [[ "$ANALYTICS_PREPARED" != true ]]; then
            test -n "$ANALYTICS_CACHE_MATCHED_KEY"
            echo "::notice title=Analytics fallback::Using cached analytics after preparation failed."
            exit 0
          fi

          analytics_backup_path="$(mktemp -d)"
          mkdir -p "_data/analytics" "api/analytics"
          mv -v "_data/analytics" "${analytics_backup_path}/data_analytics"
          mv -v "api/analytics" "${analytics_backup_path}/api_analytics"

          if brew generate-analytics-api --history=analytics/history.json --homebrew-site="$(brew --cache)/analytics/brew.sh" --github-packages-limit=1000 --legacy-homebrew="$(brew --cache)/analytics/legacy-homebrew"; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$ANALYTICS_CACHE_MATCHED_KEY" ]]; then
            echo "::error title=Analytics generation failed::No cached analytics data is available as a fallback."
            exit 1
          fi

          rm -rf "_data/analytics" "api/analytics"
          mv -v "${analytics_backup_path}/data_analytics" "_data/analytics"
          mv -v "${analytics_backup_path}/api_analytics" "api/analytics"

          echo "::notice title=Analytics fallback::Restored cached analytics data after brew generate-analytics-api failure."
        if: steps.cache.outputs.cache-hit != 'true' && (github.ref_name == 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'))
        env:
          ANALYTICS_PREPARED: ${{ steps.bootstrap.outcome == 'success' && steps.histories.outcome == 'success' && steps.posts.outcome == 'success' }}
          ANALYTICS_CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          HOMEBREW_INFLUXDB_TOKEN: ${{ secrets.HOMEBREW_INFLUXDB_READ_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      - name: Validate analytics data
        run: |
          ruby script/prune-analytics.rb
          test -s _data/analytics/install/30d.json
          test -s api/analytics/install/30d.json
          test -s _data/analytics/github-packages/30d.json
          test -s api/analytics/github-packages/30d.json
          test -s _data/analytics/github/history.json
          test -s api/analytics/github/history.json
          test -s _data/analytics/releases/history.json
          test -s api/analytics/releases/history.json
          test -s _data/analytics/formula-history/history.json
          test -s api/analytics/formula-history/history.json

      - name: Save analytics data cache
        # Save only freshly generated data so a fallback is not pinned for the day.
        if: steps.update.outputs.fresh == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics
            api/analytics
          key: analytics-data-v9-${{ hashFiles('analytics/history.json') }}-${{ steps.analytics-cache-date.outputs.date }}

      - name: Save analytics working cache
        # Preserve completed queries even when generation falls back to older output.
        if: always() && steps.update.outcome != 'skipped' && steps.update.outcome != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.formula-analytics.outputs.downloads-cache-directory }}
            ${{ steps.formula-analytics.outputs.analytics-cache-directory }}
          key: ${{ steps.working-cache.outputs.cache-primary-key }}

      - name: Archive data
        run: tar czvf data-analytics.tar.gz _data/analytics api/analytics

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-analytics
          path: data-analytics.tar.gz
          retention-days: 1

  build:
    needs: [generate-cask, generate-core, generate-internal, generate-advisories, generate-analytics]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: false

      - name: Set up Ruby
        uses: Homebrew/actions/setup-ruby@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          bundler-cache: true
          portable-ruby: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Move artifacts into place
        run: |
          tar xvf data-advisories/data-advisories.tar.gz
          tar xvf data-analytics/data-analytics.tar.gz
          tar xvf data-cask/data-cask.tar.gz
          tar xvf data-core/data-core.tar.gz
          tar xvf data-internal/data-internal.tar.gz

      - name: Install oras for pulling from GitHub Packages
        run: brew install oras

      - name: Pull executables.txt from GitHub Packages
        run: oras pull ghcr.io/homebrew/command-not-found/executables:latest --output api/internal

      - name: Generate API samples
        run: |
          GENERATE_SAMPLES="${{ github.ref_name == 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]') }}"
          if [ "$GENERATE_SAMPLES" = "true" ]; then
            ruby script/generate-api-samples.rb
          else
            ruby script/generate-api-samples.rb --template
          fi

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate build
        run: ./script/validate-build.rb

      - name: Test generated site
        env:
          API_SIGNING_TEST_SITE: _site
          FORMULA_FEEDS_TEST_SITE: _site
          FORMULA_FEEDS_AVAILABLE: ${{ needs.generate-core.outputs.formula-feeds-available }}
        run: bundle exec rspec

      - name: Upload unsigned site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: unsigned-site

  deploy:
    needs: build
    if: >-
      github.repository == 'Homebrew/formulae.brew.sh' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
      pages: write
      id-token: write
    # JWS_HOMEBREW_1 must exist only in this environment, restricted to branch main.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deploy_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out signing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: false

      - name: Set up Ruby
        uses: Homebrew/actions/setup-ruby@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          bundler-cache: true
          portable-ruby: true

      - name: Download unsigned site from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-site
          path: unsigned-site

      - name: Restore unsigned site
        run: |
          mkdir _site
          tar --extract --file unsigned-site/artifact.tar --directory _site

      - name: Sign and verify API
        env:
          JWS_SIGNING_KEY_ID: homebrew-1
          JWS_SIGNING_KEY: ${{ secrets.JWS_HOMEBREW_1 }}
        run: bundle exec script/sign-json.rb

      - name: Upload signed site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  deploy-issue:
    name: Open/close deploy issues
    needs: [generate-cask, generate-core, generate-analytics, generate-internal, generate-advisories, build, deploy]
    if: ${{ always() && github.ref_name == 'main' }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # for Homebrew/actions/create-or-update-issue
    steps:
      - name: Open, update, or close deploy issue
        uses: Homebrew/actions/create-or-update-issue@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          title: formulae.brew.sh deployment failed!
          body: The most recent [formulae.brew.sh deployment failed](${{ env.RUN_URL }}).
          labels: deploy failure
          update-existing: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
          close-existing: ${{ needs.deploy.result == 'success' }}
          close-from-author: github-actions[bot]
          close-comment: The most recent [formulae.brew.sh deployment succeeded](${{ env.RUN_URL }}). Closing issue.
