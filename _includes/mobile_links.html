<script>
  // GitHub Mobile drops the search term from repository pulls?q= links.
  // Remove once fixed: https://github.com/orgs/community/discussions/213084
  (function() {
    const ua = navigator.userAgent;
    // iPadOS Safari reports a Mac user agent; only the iPad has touch.
    const iPad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    if (/Android|iPhone|iPad|iPod/i.test(ua) || iPad) {
      for (const link of document.querySelectorAll('a[data-mobile-href]')) {
        link.href = link.dataset.mobileHref;
      }
    }
  })();
</script>
